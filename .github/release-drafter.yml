exclude-labels:
  - ignore
  - release
  - dependencies
# Release notes for the batchcorder package.  batchcorder-datafusion has its
# own drafter, release-drafter-datafusion.yml; PRs that touch the shared core
# crates appear in both drafts, the cue to release both packages.
name-template: 'batchcorder unreleased'
version-template: unreleased
# Drafts and previous releases are matched by tag prefix.  The draft's tag is
# the bare prefix: complete it (batchcorder-vX.Y.Z) when publishing.
tag-prefix: 'batchcorder-v'
tag-template: 'batchcorder-v'
include-paths:
  - crates/batchcorder-py
  - crates/batchcorder-core
  - crates/batchcorder-pyo3
  - python
  - docs
  - README.md
  - pyproject.toml

change-template: '- $TITLE (#$NUMBER)'

autolabeler:
  - label: 'release'
    title:
      - '/^release(\(.*\))?:/i'
  - label: 'dependencies'
    title:
      - '/^chore\(deps\):/i'
      - '/^fix\(deps\):/i'
  - label: 'perf'
    title:
      - '/^perf(\(.*\))?:/i'
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?:/i'
      - '/^chore\(docs\):/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?:/i'
      - '/^chore\(ci\):/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?:/i'
  - label: 'internal'
    title:
      - '/^ref(\(.*\))?:/i'
      - '/^refactor(\(.*\))?:/i'
      - '/^spike(\(.*\))?:/i'

categories:
  - title: 🚀 Performance improvements
    labels:
      - performance
      - perf
  - title: ✨ Enhancements
    labels:
      - feature
      - enhancement
  - title: 🐞 Bug fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: 📖 Documentation
    labels:
      - documentation
      - docs
  - title: 📦 Build system
    labels:
      - build
      - ci
      - chore
  - title: 🛠️ Other improvements
    labels:
      - internal
      - maintenance

template: |
  ## Changes

  $CHANGES

  Thank you to all our contributors for making this release possible!
  $CONTRIBUTORS
