name: build-wheels

# Builds the wheels and the sdist of one package.  Artifact names carry the
# package name, so a caller never mixes the two projects.

on:
  workflow_call:
    inputs:
      package:
        description: "batchcorder or batchcorder-datafusion"
        required: true
        type: string

permissions:
  contents: read

env:
  # batchcorder builds from the root pyproject.toml (whose manifest-path
  # points at crates/batchcorder-py); batchcorder-datafusion has its own.
  MANIFEST_ARGS: ${{ inputs.package == 'batchcorder-datafusion' && '-m crates/batchcorder-datafusion-py/Cargo.toml' || '' }}
  # Both extensions are abi3, so one CPython wheel covers every version.
  # --find-interpreter also builds a PyPy wheel per PyPy interpreter;
  # datafusion-python ships no PyPy wheels, so batchcorder-datafusion skips
  # them (and avoids compiling DataFusion once per wheel).
  INTERPRETER_ARGS: ${{ inputs.package == 'batchcorder-datafusion' && '-i python3.11' || '--find-interpreter' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check package name
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            batchcorder | batchcorder-datafusion) ;;
            *) echo "Unknown package: '$PACKAGE'" >&2; exit 1 ;;
          esac

  linux:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ env.INTERPRETER_ARGS }} ${{ env.MANIFEST_ARGS }}
          sccache: 'true'
          manylinux: ${{ matrix.target == 'aarch64' && '2_28' || 'auto' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.package }}-ubuntu-${{ matrix.target }}
          path: dist

  windows:
    needs: check
    runs-on: windows-latest
    strategy:
      matrix:
        # datafusion-python ships no win32 wheels, so a 32-bit
        # batchcorder-datafusion wheel could never be installed with a host.
        target: ${{ fromJSON(inputs.package == 'batchcorder-datafusion' && '["x64"]' || '["x64", "x86"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ env.INTERPRETER_ARGS }} ${{ env.MANIFEST_ARGS }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.package }}-windows-${{ matrix.target }}
          path: dist

  macos:
    needs: check
    # Pinned like ci.yaml: macos-latest jobs sat queued without a runner,
    # and macos-14 was retired.
    runs-on: macos-15
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ env.INTERPRETER_ARGS }} ${{ env.MANIFEST_ARGS }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.package }}-macos-${{ matrix.target }}
          path: dist

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist ${{ env.MANIFEST_ARGS }}
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ inputs.package }}
          path: dist
