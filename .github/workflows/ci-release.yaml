name: ci-release

# Publishes one package per release.  The release tag names the package:
#   batchcorder-vX.Y.Z             -> batchcorder
#   batchcorder-datafusion-vX.Y.Z  -> batchcorder-datafusion
# so a release can never upload half of a two-project release.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and upload"
        required: true
        type: choice
        options:
          - batchcorder
          - batchcorder-datafusion
  release:
    types: [published]

# we do not want more than one release workflow executing at the same time, ever
concurrency:
  group: release
  # cancelling in the middle of a release would create incomplete releases
  # so cancel-in-progress is false
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  which:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.map.outputs.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Map the release tag to a package
        id: map
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: bash scripts/release-package.sh "$EVENT" "$TAG" "$INPUT_PACKAGE" >> "$GITHUB_OUTPUT"

  build:
    needs: which
    uses: ./.github/workflows/build-wheels.yaml
    with:
      package: ${{ needs.which.outputs.package }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [which, build]
    # Each PyPI project's trusted publisher names this environment, so only
    # jobs that run in it can upload.  Its deployment rules on GitHub decide
    # which refs may publish.
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      # Only this run's artifacts are visible, and they hold one package.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Both PyPI projects trust this repository, ci-release.yaml and the
      # pypi environment; no API token is involved.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
