name: ci-pre-release

# Builds one package and uploads it to TestPyPI.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and upload"
        required: true
        type: choice
        options:
          - batchcorder
          - batchcorder-datafusion

# we do not want more than one release workflow executing at the same time, ever
concurrency:
  group: release
  # cancelling in the middle of a release would create incomplete releases
  # so cancel-in-progress is false
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-wheels.yaml
    with:
      package: ${{ inputs.package }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write  # trusted publishing (batchcorder-datafusion)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The project-scoped token can only upload batchcorder.
      - name: Publish batchcorder to TestPyPI
        if: inputs.package == 'batchcorder'
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          MATURIN_REPOSITORY: "testpypi"
        with:
          command: upload
          args: --non-interactive --skip-existing ./dist/*

      # Needs a trusted publisher for this repository and
      # ci-pre-release.yaml on the batchcorder-datafusion TestPyPI project.
      - name: Publish batchcorder-datafusion to TestPyPI
        if: inputs.package == 'batchcorder-datafusion'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
