name: ci-pre-release

# Builds one package and uploads it to TestPyPI.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and upload"
        required: true
        type: choice
        options:
          - batchcorder
          - batchcorder-datafusion

# we do not want more than one release workflow executing at the same time, ever
concurrency:
  group: release
  # cancelling in the middle of a release would create incomplete releases
  # so cancel-in-progress is false
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-wheels.yaml
    with:
      package: ${{ inputs.package }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    # Each TestPyPI project's trusted publisher names this environment, so
    # only jobs that run in it can upload.
    environment: testpypi
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Both TestPyPI projects trust this repository, ci-pre-release.yaml and
      # the testpypi environment; no API token is involved.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
