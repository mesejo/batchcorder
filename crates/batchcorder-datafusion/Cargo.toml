[package]
name = "batchcorder-datafusion"
version = "0.1.0"
edition = "2024"
description = "DataFusion TableProvider that tees one read-once Arrow stream to every scan in a query"
license = "Apache-2.0"
publish = false

[dependencies]
batchcorder-core = { path = "../batchcorder-core" }

# Pinned to the DataFusion major whose Arrow major matches the workspace (59).
# Default features are off: the provider needs only the catalog and physical
# plan APIs, not SQL, Parquet or the expression function libraries.
datafusion = { version = "55", default-features = false }
async-trait = "0.1"

[dev-dependencies]
# SQL is only needed to drive the provider from tests.
datafusion = { version = "55", default-features = false, features = ["sql"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
