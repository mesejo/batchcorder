[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "batchcorder-datafusion"
requires-python = ">=3.10"
description = "DataFusion table provider that tees one read-once Arrow stream to every scan in a query"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Mesejo" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
# No hard dependency on a host: users have one, and each host embeds its own
# copy of DataFusion.  The extras name the hosts built on the same DataFusion
# major as datafusion-ffi in Cargo.toml (the FFI structs are only compatible
# within one major).  Keep them in sync with SUPPORTED_HOSTS in
# python/batchcorder_datafusion/_hosts.py.
dependencies = ["pyarrow>=18"]

[project.optional-dependencies]
datafusion = ["datafusion>=55,<56"]
# xorq-datafusion 0.3.x is the DataFusion 55 line.
xorq = ["xorq-datafusion>=0.3,<0.4"]

[project.urls]
Homepage = "https://github.com/mesejo/batchcorder"
Repository = "https://github.com/mesejo/batchcorder"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "batchcorder_datafusion._batchcorder_datafusion"

# Checked separately from batchcorder: pyright -p crates/batchcorder-datafusion-py
[tool.pyright]
include = ["python", "tests"]
