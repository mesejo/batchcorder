[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "batchcorder-datafusion"
requires-python = ">=3.10"
description = "DataFusion table provider that tees one read-once Arrow stream to every scan in a query"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Mesejo" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
# No dependency on a DataFusion host: users bring their own, and each host
# embeds its own copy of DataFusion.  The supported host versions are in
# SUPPORTED_HOSTS (python/batchcorder_datafusion/_hosts.py) and the README;
# registering the provider with any other host raises RuntimeError.
dependencies = ["pyarrow>=18"]

[project.urls]
Homepage = "https://github.com/mesejo/batchcorder"
Repository = "https://github.com/mesejo/batchcorder"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "batchcorder_datafusion._batchcorder_datafusion"

# Checked separately from batchcorder: pyright -p crates/batchcorder-datafusion-py
[tool.pyright]
include = ["python", "tests"]
