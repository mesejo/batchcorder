[package]
name = "batchcorder"
version = "0.1.3"
edition = "2024"

[lib]
name = "_batchcorder"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"

[dependencies]
# Python bindings
pyo3 = { version = "0.28", features = [
  "extension-module",
  "abi3",
  "abi3-py310",
] }
pyo3-stub-gen = { version = "0.19", default-features = false }

# Cache, readers and eviction (no PyO3)
batchcorder-core = { path = "crates/batchcorder-core" }

# Arrow types and the C Data / C Stream FFI used at the Python boundary
arrow-array = { workspace = true, features = ["ffi"] }
arrow-pyarrow = "58"
arrow-schema = { workspace = true }

# The root package is the PyO3 extension that maturin builds; the pure-Rust
# cache lives in crates/batchcorder-core and the DataFusion table provider in
# crates/batchcorder-datafusion.  All are default members, so a bare
# `cargo test` / `cargo clippy` at the root covers them too.  The extension
# does not depend on the DataFusion crate, so wheels do not pull DataFusion in.
[workspace]
members = [".", "crates/batchcorder-core", "crates/batchcorder-datafusion"]
default-members = [
  ".",
  "crates/batchcorder-core",
  "crates/batchcorder-datafusion",
]

[workspace.dependencies]
arrow-array = "58"
arrow-schema = "58"
arrow-ipc = "58"

# Full DWARF is not needed for the Python test loop. Line tables keep file and
# line numbers for this crate in panics and backtraces; dependencies carry no
# debuginfo at all, which cuts a clean `target/` from ~830 MB to ~560 MB and
# the debug `.so` from 71 MB to 15 MB. Override per invocation when stepping
# through Rust in a debugger. Both keys are needed, since the per-package
# override below wins over the profile-level setting for dependencies:
#   maturin develop --config 'profile.dev.debug=true' \
#       --config 'profile.dev.package."*".debug=true'
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lints.rust]
# Py_GIL_DISABLED is a cfg set by pyo3's build script to indicate free-threaded Python.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(Py_GIL_DISABLED)'] }
