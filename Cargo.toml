[package]
name = "batchcorder"
version = "0.1.3"
edition = "2024"

[lib]
name = "_batchcorder"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"

[dependencies]
# Python bindings
pyo3 = { workspace = true, features = ["extension-module"] }
pyo3-stub-gen = { version = "0.23", default-features = false }

# Cache, readers and eviction (no PyO3), and the PyO3 glue shared with the
# batchcorder-datafusion extension (GIL handling, Python upstream)
batchcorder-core = { path = "crates/batchcorder-core" }
batchcorder-pyo3 = { path = "crates/batchcorder-pyo3" }

# Arrow types and the C Data / C Stream FFI used at the Python boundary
arrow-array = { workspace = true, features = ["ffi"] }
arrow-pyarrow = { workspace = true }
arrow-schema = { workspace = true }

# The root package is the `batchcorder` PyO3 extension that maturin builds.
#   crates/batchcorder-core           pure-Rust cache (no PyO3)
#   crates/batchcorder-pyo3           PyO3 glue shared by both extensions
#   crates/batchcorder-datafusion     DataFusion TableProvider (no PyO3)
#   crates/batchcorder-datafusion-py  the separate `batchcorder-datafusion`
#                                     wheel (its own pyproject.toml)
# All are default members, so a bare `cargo test` / `cargo clippy` at the
# root covers them.  The `batchcorder` extension does not depend on
# DataFusion, so its wheel does not pull DataFusion in.
[workspace]
members = [
  ".",
  "crates/batchcorder-core",
  "crates/batchcorder-pyo3",
  "crates/batchcorder-datafusion",
  "crates/batchcorder-datafusion-py",
]
default-members = [
  ".",
  "crates/batchcorder-core",
  "crates/batchcorder-pyo3",
  "crates/batchcorder-datafusion",
  "crates/batchcorder-datafusion-py",
]

[workspace.dependencies]
arrow-array = "59"
arrow-schema = "59"
arrow-ipc = "59"
arrow-pyarrow = "59"
pyo3 = { version = "0.29", features = ["abi3", "abi3-py310"] }

# Full DWARF is not needed for the Python test loop. Line tables keep file and
# line numbers for this crate in panics and backtraces; dependencies carry no
# debuginfo at all, which cuts a clean `target/` from ~830 MB to ~560 MB and
# the debug `.so` from 71 MB to 15 MB. Override per invocation when stepping
# through Rust in a debugger. Both keys are needed, since the per-package
# override below wins over the profile-level setting for dependencies:
#   maturin develop --config 'profile.dev.debug=true' \
#       --config 'profile.dev.package."*".debug=true'
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lints.rust]
# Py_GIL_DISABLED is a cfg set by pyo3's build script to indicate free-threaded Python.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(Py_GIL_DISABLED)'] }
